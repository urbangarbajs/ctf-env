networks:
  news_ctf_net:
    name: news_ctf_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-news-ctf"
    ipam:
      config:
        - subnet: 10.10.20.0/24

services:
  srv-news-web:
    build: ./web-news
    container_name: ctf_srv_news_web
    depends_on:
      - srv-news-db
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.11
    environment:
      DB_HOST: "10.10.20.21"
      DB_USER: "newsUser"
      DB_PASS: "NewsPortal2026!"
      DB_NAME: "news_portal"
      FLAG_XSS: "NP-CTF{STORED_XSS_IN_NEWSROOM}"
    # Intentionally no host ports are published. For local debugging only:
    # ports:
    #   - "8080:80"

  srv-news-db:
    build: ./db-news
    container_name: ctf_srv_news_db
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.21
    environment:
      MYSQL_ROOT_PASSWORD: "rootpass2026"
      MYSQL_DATABASE: "news_portal"
      MYSQL_USER: "newsUser"
      MYSQL_PASSWORD: "NewsPortal2026!"

  srv-news-ftp:
    build: ./ftp-news
    container_name: ctf_srv_news_ftp
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.41

  srv-news-mail:
    build: ./mail-server
    container_name: ctf_srv_news_mail
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.51
