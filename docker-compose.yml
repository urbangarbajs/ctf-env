networks:
  news_ctf_net:
    name: news_ctf_net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-news-ctf"
    ipam:
      config:
        - subnet: 10.10.20.0/24

services:
  srv-news-web:
    build: ./web-news
    container_name: ctf_srv_news_web
    depends_on:
      - srv-news-db
      - srv-news-api
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.11
    environment:
      DB_HOST: "10.10.20.21"
      DB_USER: "newsUser"
      DB_PASS: "NewsPortal2026!"
      DB_NAME: "news_portal"

  srv-news-db:
    build: ./db-news
    container_name: ctf_srv_news_db
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.21
    environment:
      MYSQL_ROOT_PASSWORD: "rootpass2026"
      MYSQL_DATABASE: "news_portal"
      MYSQL_USER: "newsUser"
      MYSQL_PASSWORD: "NewsPortal2026!"

  srv-news-smb:
    build: ./smb-news
    container_name: ctf_srv_news_smb
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.31

  srv-news-api:
    build: ./api-editorial
    container_name: ctf_srv_news_api
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.61

  srv-news-editor:
    build: ./editor-client
    container_name: ctf_srv_news_editor
    depends_on:
      - srv-news-web
      - srv-news-api
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.71

  srv-news-monitor:
    build: ./monitor-news
    container_name: ctf_srv_news_monitor
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.81

  attacker-helper:
    build: ./attacker-helper
    container_name: ctf_attacker_helper
    profiles: ["attacker"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      news_ctf_net:
        ipv4_address: 10.10.20.90
