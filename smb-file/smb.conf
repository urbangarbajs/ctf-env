[global]
   workgroup = WORKGROUP
   server string = CTF SMB Server
   security = user
   map to guest = Bad User
   guest account = nobody
   server role = standalone server
   smb ports = 445
   disable netbios = yes

[BACKUPS]
   path = /srv/samba/backups
   browseable = yes
   read only = yes
   guest ok = yes
