[global]
   workgroup = NOVAPRESS
   netbios name = NP-FILE-01
   server string = NovaPress newsroom file server
   map to guest = Bad User
   guest account = nobody
   usershare allow guests = yes
   restrict anonymous = 0
   server min protocol = SMB2
   server signing = disabled
   client signing = disabled
   log file = /var/log/samba/log.%m
   max log size = 1000

[public]
   path = /srv/samba/public
   browseable = yes
   read only = yes
   guest ok = yes

[editorial]
   path = /srv/samba/editorial
   browseable = yes
   read only = yes
   guest ok = yes

[dropbox]
   path = /srv/samba/dropbox
   browseable = yes
   read only = no
   writable = yes
   guest ok = yes
   create mask = 0666
   directory mask = 0777
   force user = nobody
   force group = nogroup
