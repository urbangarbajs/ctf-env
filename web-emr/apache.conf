# Force a vulnerable-looking banner (still running modern Apache inside container)
ServerTokens Full
ServerSignature On
Header unset Server
# Force legacy-looking banner for CTF identification
Header always edit Server .* "Apache/2.4.49 (Ubuntu)"

# Intentionally lax directory config to mirror CVE-2021-41773 path traversal test cases
<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
